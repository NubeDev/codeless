name: runtime-driver-recovery
goal: |
  Fix three runtime bugs that wedged a real job in Queued state:
  (1) the driver loop is event-only and never retries on error,
  (2) WorktreeManager.create errors AlreadyExists on path collision
  with no adoption or prune path, and (3) the job state machine has
  no edge out of Queued, so a Queued job whose driver kept failing
  has no manual escape. Make worktree creation self-healing,
  add bounded retry-with-backoff to the driver loop, and ship a
  reset_job RPC that moves Queued|Failed|Stopped to Draft as a
  user-driven recovery hatch. Add tests for each. Do not regress
  R1 (process spawn stays in codeless-adapters-host) or R5
  (single-tenant trust unchanged).

stages:
  - "Reproduce + characterise — write a failing integration test that drives a job to the wedged-Queued state (worktree-exists, no retry). Test lives under codeless-runtime; uses MockRunner and a tempdir-backed WorktreeManager. The test should fail BEFORE any fix lands; it becomes the regression gate."
  - "Fix bug 2 idempotent worktree create — in crates/codeless-adapters-host/src/worktree.rs, make WorktreeManager.create handle path collision by (a) running `git worktree prune` first to clear stale admin entries, (b) if the path still exists and is a valid worktree on the requested branch, adopt it and return a WorktreeHandle, (c) only error if the path exists but is incompatible (different branch, not a worktree). Add unit tests for all three branches. Keep AlreadyExists variant for the genuinely-incompatible case."
  - "Fix bug 1 driver retry-on-error — in crates/codeless-runtime/src/job_driver_loop.rs, wrap the drive_job spawn so that on error: (a) the error is logged with kind classification, (b) for retryable errors (worktree-create, IO, transient db) re-publish JobQueued after a backoff (30s, 120s, 600s, then give up and transition Queued to Failed with stop_reason recorded), (c) non-retryable errors (runner-not-enabled, template parse) transition to Failed immediately. Add an in-test cap so unit tests do not sleep for real."
  - "REVIEW before state-machine edge change — confirm bugs 1+2 are covered by tests and integrated; confirm the retry classifier is correct (worktree-exists is retryable, runner-not-enabled is not); decide whether reset_job should also be available from Running (lean no — pause first). Record decision in DOCS/RUNTIME-DRIVER-RECOVERY-DECISIONS.md."
  - "Fix bug 3 reset_job RPC — add ResetJobArgs to crates/codeless-rpc/src/methods.rs; add reset_job in crates/codeless-runtime/src/rpc/jobs.rs that moves Queued|Failed|Stopped to Draft, clears worktree_path (after attempting WorktreeManager.remove), clears stop_reason and ended_at, publishes a JobReset event (new variant). Allowed transitions in crates/codeless-runtime/src/state_machine.rs gain three edges: (Queued, Draft), (Failed, Draft), (Stopped, Draft). Add unit tests for each transition and a refusal test for Running."
  - "UI affordance for reset_job — surface the method via RpcClient typing in codeless-rpc bindings; add a Reset button to the job page only in Queued|Failed|Stopped statuses; never expose Reset while Running. R2: UI imports RpcClient only. Test: the button is hidden in Running state. (If UI work is out of scope for this loop, mark this stage NEXT and halt; do not silently skip.)"
  - "Workspace liveness sweep audit — the bug post-mortem noted the liveness sweep was suspected of flipping Stopped to Queued. Audit crates/codeless-runtime/src/workspace_liveness.rs and confirm it never touches job state (it should only emit WorkspaceUnhealthy or WorkspaceRecovered events). Document the finding in DECISIONS file; add a test that the sweep is a no-op on job rows."
  - "REVIEW final — confirm R1 holds (process::Command outside codeless-adapters-host returns zero grep matches), R5 unchanged (no new auth surface), no new persistence store added, the three fixes compose correctly (worktree adoption + retry + manual reset cover the wedge class without overlap), and the original wedge scenario is regression-tested. Verify cargo test, cargo clippy -D warnings, cargo fmt all pass."
