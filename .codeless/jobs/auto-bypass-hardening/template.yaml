name: auto-bypass-hardening
goal: |
  Split infrastructure failures out of FailureClass::RunnerError so disk-
  full / IO / corruption errors halt the job instead of being auto-
  bypassed, switch the SQLite pool to WAL journal mode, tighten the
  pre-check Done-vs-diff path tokenizer so non-path tokens
  (metadata.delivery.slack, rest_proxy.path, tool.call) stop tripping
  false positives, thread the prior stage's failure_class + failure_detail
  into the next stage's prompt when auto-bypass advances, and surface
  bypassed-after-failure as a distinct glyph + tooltip in StagesOverview
  so the operator sees recovery happening at a glance. After this job,
  a SQLITE_FULL during a stage halts cleanly, a precheck false positive
  is rare, every bypass carries forward the reason it fired, and the
  job overview shows ~ for bypassed vs ! for halted.

stages:
  - "stage 1: resolve open questions (the four-item set in SCOPE.md - exact SQLite error-code set that maps to InfrastructureError, WAL pragma timing, tokenizer rule for path-shaped tokens, exact wording of the bypass-comment failure_detail thread-through) and inline the resolutions in SCOPE.md; no implementation"
  - "stage 2: codeless-types - add FailureClass::InfrastructureError variant with serde wire name infrastructure-error; failure_class_label / parse_failure_class round-trip in codeless-runtime/src/store/codec.rs; specta wire snapshot regenerated; cargo test -p codeless-types green"
  - "stage 3: codeless-runtime - sqlx error -> FailureClass mapper at every RunnerError emit site (template_runner.rs lines 1051, 1494, 1579 + any others surfaced by grep) so SQLITE_FULL / CANTOPEN / IOERR / CORRUPT classify as InfrastructureError; unit test pins each error code's classification"
  - "stage 4: classify_stage_failure in template_runner.rs short-circuits to FailureAction::Halt for FailureClass::InfrastructureError regardless of auto_bypass_policy (mirroring the existing stop_reason.is_some() short-circuit); halt writes a structured stop_reason on the job row so the UI labels it Infrastructure failure rather than a generic crash; unit test covers (a) infra-error halts even under Relentless policy and (b) RunnerError without infra classification still auto-bypasses"
  - REVIEW M-INFRA - infra-error halt path end-to-end - simulate a SQLITE_FULL by injecting a pool with PRAGMA max_page_count=1, observe Halt with stop_reason=Infrastructure, observe no stage-auto-bypassed event emitted, observe the next stage is not started
  - "stage 5: SqliteStore pool config in crates/codeless-runtime/src/store/mod.rs - apply PRAGMA journal_mode=WAL, PRAGMA synchronous=NORMAL, PRAGMA busy_timeout=5000 on every connection acquire via SqlitePoolOptions::after_connect; existing in-memory test stores opt out (WAL is meaningless on :memory:); migrations matrix test still green on a fresh on-disk DB"
  - "stage 6: precheck path tokenizer in the diff-verify pre-check (grep crates/codeless-runtime for the existing tokenizer; likely in template_runner or a sibling module) - a path-shaped token must EITHER start with a known repo-relative prefix derived from the diff's file list OR resolve to an existing file under the worktree at check-time; tokens like foo.bar.baz, rest_proxy.path, metadata_json.delivery.slack must NOT be flagged; unit tests cover the four real-world false positives from jobs 01KRX4ZPF and 01KRXH0R plus the negative cases (real missing paths still flagged)"
  - "stage 7: auto_bypass_policy.rs policy_comment - when the prior stage's failure_class is non-None, append a 'Previous-stage failure: <failure_class>: <failure_detail>' block to the Operator comment threaded into the next stage's prompt; the existing canned guidance stays as the lead paragraph; unit test pins the assembled comment for (a) pre-check-failed with detail, (b) review-fail with detail, (c) None failure_class falls through to the bare policy text"
  - "stage 8: StageRecorder + the bypass-comment-build path - ensure the prior stage's failure_class + failure_detail are loaded from the stages row at bypass time and passed into policy_comment per stage 7; integration test using MockRunner runs a Failed stage with pre-check-failed + a synthetic detail string, then asserts the next stage's prompt_prefix carries the threaded block"
  - REVIEW M-FLOW - bypass thread-through end-to-end - run a templated job under MockRunner where stage 1 fails with pre-check-failed and a fixture detail, stage 2 auto-bypasses, assert the recorded prompt for stage 2 contains both the policy guidance and the prior failure_detail
  - "stage 9: codeless-types::Event and the list_stages payload - confirm the bypassed_at + bypassed_reason columns are already on the wire StageRow (they are, per wire.ts line ~2310); add a new field bypassed: boolean to the StagesOverview StageRow TS type derived from rollup.stage.bypassed_at !== null; no schema change needed"
  - "stage 10: UI - StagesOverview.tsx stageGlyph() returns a new tone for failed + bypassed: glyph ~ in muted-foreground rather than ! in destructive; the stage row title carries a tooltip 'auto-bypassed by <policy>: <failure_detail>' using the new bypassed flag plus the stage's failureDetail; vitest snapshot updated; no other site touched"
  - "stage 11: UI - JobTimeline.tsx already renders stage-auto-bypassed via a chip; verify the chip's tooltip carries the failure_class + failure_detail (extend if not); vitest covers (a) bypassed-after-fail renders ~ in overview + chip in timeline + threaded comment in gate panel and (b) hard-fail-no-bypass still renders ! and no chip"
  - REVIEW M-UI - UI surfacing end-to-end - load a job page for a completed job whose history includes an auto-bypassed stage; assert StagesOverview shows ~ for the bypassed row, the tooltip carries the policy + failure_detail, JobTimeline shows the chip with the same detail, and StageDetail's ReviewGatePanel autoBypass block is unchanged
  - "stage 12: documentation + handover - DOCS/AUTO-BYPASS-DECISIONS.md gains a new Q for InfrastructureError (the rule + the error-code set + why caps and infra share the Halt branch); DOCS/JOB-WORKFLOW.md precheck-rules TODO section flips to a documented Precheck rule #1 with the tightened tokenizer wording; CODELESS.md 'What works today' gains a line on infra-error halt + WAL + bypass-comment thread-through + bypassed glyph; final cargo test --workspace + cargo clippy --workspace --all-targets -- -D warnings + cargo fmt --check + pnpm -C ui/codeless-ui lint + pnpm -C ui/codeless-ui test green; handover paragraph summarises what is deferred (the precheck tokenizer is hardened, not rewritten - a fuller diff-verify overhaul is a separate job)"
