name: job-export
goal: |
  Implement Job export/import (the E1 phase of DOCS/SCOPE-JOB-EXPORT.md):
  a `.codeless-job` bundle that captures one Job's template, handover,
  notes, and full per-Run history (Stages, Tasks, Todos, Events,
  Reviews), plus `export_job` / `import_job` / `inspect_job_bundle`
  RPCs and the minimal UI affordances so a user can export from one
  workspace, import into another, and hit run with no further setup.

stages:
  - survey current Job/Run schema and confirm JOB-WORKFLOW (B) precondition status; list every table column the bundle must serialize
  - design bundle layout and manifest.json schema_version 1 against DOCS/SCOPE-JOB-EXPORT.md; lock the secrets denylist and per-entry size caps
  - REVIEW bundle shape and RPC argument types before any code lands
  - implement codeless-runtime job_export walker plus serializer that emits manifest, JSONL streams, and the gzipped tar to a server-side path
  - implement importer with tar-streaming, path-traversal guards, batched SQLite inserts in one transaction, and ImportConflictPolicy (Refuse default)
  - wire export_job, import_job, inspect_job_bundle RPCs in codeless-rpc and codeless-runtime; refuse export of any Job with a non-terminal Run
  - add round-trip property test (export then import into scratch workspace, assert row body equality and ordering) and tar-safety unit tests
  - REVIEW server-side behaviour end-to-end before touching UI
  - add Export button on Job page and Import Job dialog on workspace sidebar with manifest preview, conflict policy selector, and warnings banner
  - add imported-from chip on imported Jobs plus read-only manifest viewer; verify [run] on an imported Job creates ordinal max+1 against destination HEAD
