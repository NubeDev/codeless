name: fix-jobs
goal: |
  Fix two regressions:
  1. Opening a second job-detail tab leaves the right pane blank.
     JobDetailStack mounts all job-detail JobPages simultaneously and
     toggles visibility; the bug is that two parallel JobPage instances
     share state through some module-level singleton (suspected: SSE
     subscription, chat store, or useJob cache). Find the root cause,
     add a failing RTL test, fix the underlying state-sharing bug —
     not a remount workaround.
  2. Chat messages sent while a job is in spec mode do not persist
     across page reloads. Normal chat history persists correctly.
     Trace the message lifecycle from UI send through to SQLite; if
     the root cause is in the Rust backend, a narrowly targeted fix
     is in scope.

docs:
  - CHAT.md
stages:
  - reproduce the bug locally with two job-detail tabs open at once and capture which side is blank, the dev-tools console errors, and the network/SSE state for both jobIds; write findings into SCOPE.md §Reproduction (S)
  - read codeless/ui/codeless-ui/src/lib/rpc/ hooks + SSE plumbing + the chat store; identify exactly which module-level state is shared across JobPage instances and document it in SCOPE.md §Root cause (S)
  - write a failing React Testing Library test mounting two JobPage instances against different jobIds with MockRpcClient, asserting both subscribe to their own scope and both useJob queries resolve independently; the test must fail on master (M)
  - REVIEW root cause and failing test before applying any fix
  - apply the minimal fix at the identified shared-state site; one commit per distinct root cause if more than one (M)
  - verify in the running app — two job-detail tabs open, switching is instant, both render their own content, both receive their own live events; record the verification in SCOPE.md §Manual verification (S)
  - REVIEW final fix and verification before opening the PR
  - trace the spec-mode chat message lifecycle from the UI send (RpcClient method) through the runtime handler to the SQLite write; identify exactly where persistence is skipped; document in SCOPE.md §Spec-mode chat root cause with file:line references; if root cause is Rust-side note whether it is in scope to fix here (S)
  - apply the minimal fix that makes spec-mode chat turns durable; one commit; if the root cause is Rust-side and out of scope, open a follow-up issue and record it in SCOPE.md instead (M)
  - verify spec-mode chat persistence in the running app — send a message in spec mode, reload, confirm it reappears; record in SCOPE.md §Spec-mode chat fix verification (S)
