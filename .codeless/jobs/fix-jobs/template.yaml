name: fix-jobs
goal: |
  Fix the regression where opening a second job-detail tab leaves the
  right pane blank. JobDetailStack mounts all job-detail JobPages
  simultaneously and toggles visibility; the bug is that two parallel
  JobPage instances share state through some module-level singleton
  (suspected: SSE subscription, chat store, or useJob cache). Find the
  root cause, add a failing RTL test, fix the underlying state-sharing
  bug — not a remount workaround.

stages:
  - reproduce the bug locally with two job-detail tabs open at once and capture which side is blank, the dev-tools console errors, and the network/SSE state for both jobIds; write findings into SCOPE.md §Reproduction (S)
  - read codeless/ui/codeless-ui/src/lib/rpc/ hooks + SSE plumbing + the chat store; identify exactly which module-level state is shared across JobPage instances and document it in SCOPE.md §Root cause (S)
  - write a failing React Testing Library test mounting two JobPage instances against different jobIds with MockRpcClient, asserting both subscribe to their own scope and both useJob queries resolve independently; the test must fail on master (M)
  - REVIEW root cause and failing test before applying any fix
  - apply the minimal fix at the identified shared-state site; one commit per distinct root cause if more than one (M)
  - verify in the running app — two job-detail tabs open, switching is instant, both render their own content, both receive their own live events; record the verification in SCOPE.md §Manual verification (S)
  - REVIEW final fix and verification before opening the PR
