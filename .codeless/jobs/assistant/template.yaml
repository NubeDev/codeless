name: assistant
goal: |
  Build the in-app Assistant surface defined by DOCS/ASSISTANT-SCOPE.md.
  Extract the existing job chat into a shared CommonChat component used
  by the Assistant page, the in-job chat, and the in-editor AI panel,
  then wire the assistant's view/manage/create/edit-scope capabilities
  on top, all flowing through RpcClient with SQLite as source of truth.

stages:
  - resolve open questions in ASSISTANT-SCOPE.md milestone 1 — pick the attachments-directory option (bias option 1, workspace-scoped dir) and decide the AiChat server-state migration shape; record both decisions in SCOPE.md before writing code
  - REVIEW prerequisite decisions before extraction begins
  - extract CommonChat from JobChat (RunPane.tsx) and AiChat into codeless/ui/codeless-ui/src/modules/chat/, with attachments + image paste + tool-call cards reused; rewire RunPane, JobChatPage and the AI panel to render <CommonChat .../>, no behaviour change
  - REVIEW visual + behavioural parity of the three rewired call sites
  - add assistant_threads + assistant_messages tables, the assistant.* RPC methods (listThreads/createThread/deleteThread) and uploadAttachment(threadId, file); persistence-only, no UI yet
  - add the /assistant route with thread-list rail + CommonChat bound to the selected thread + a no-op assistant responder, so an empty thread can be created and chatted into end-to-end
  - wire view/manage tools (jobs.list/get/start/stop/pause/resume/restart/update) as confirmation-required action cards in the chat
  - wire jobs.draftFromConversation + jobs.create with the inline draft-review confirmation card
  - wire scope edit — inline unified-diff card via jobs.updateScope, plus open-in-editor; honour the paused-job rule
