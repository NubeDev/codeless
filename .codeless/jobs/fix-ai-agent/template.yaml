name: fix-ai-agent
goal: |
  Finish the assistant follow-ups described in DOCS/ASSISTANT-SCOPE.md:
  F2 (real planner replacing NOOP_ASSISTANT_REPLY), F3 (action-card
  tool dispatch + two new jobs.* RPCs), then F1 (drive the footer
  AiInputBar from the assistant). End state: a user can chat at
  /assistant or from the footer bar, receive streamed model replies,
  confirm action cards that mutate job state via real RPCs, and find
  one source of truth (SQLite) behind every chat surface.

stages:
  - Survey the F2/F3/F1 follow-ups in DOCS/ASSISTANT-SCOPE.md end-to-end; map every code anchor (assistant.rs, agent_chat in chat.rs, cliRunnerTransport.ts, AssistantThreadView.tsx); confirm the runner-side cwd for assistant threads is the workspace root; record open questions for review.
  - F2 - replace NOOP_ASSISTANT_REPLY in crates/codeless-runtime/src/rpc/assistant.rs with an agent_chat-backed planner loop; stream assistant tokens through the existing event channel; persist assistant messages with empty meta_json; per-turn integration test with MockRunner-style fake.
  - REVIEW F2 - user sends a message at /assistant, gets a streamed reply, no action cards yet; approve before touching dispatch.
  - F3a - add jobs.draftFromConversation and jobs.updateScope to codeless-rpc and codeless-runtime; updateScope rejects with a typed error on a non-paused job; per-RPC unit tests; no UI work yet.
  - F3b - implement the action-card dispatcher in codeless-runtime keyed on AssistantActionCard.action; map start/stop/pause/resume/restart/update/draft_job/edit_scope to their RPCs; per-action dispatch test plus reject-running-job test for edit_scope.
  - F3c - teach the F2 planner to emit AssistantActionCard tool calls; verify each card renders in AssistantThreadView and that confirm_assistant_action drives the dispatcher end-to-end.
  - REVIEW F3 - exercise every card path (start, stop, pause, resume, restart, update, draft_job, edit_scope) manually; confirm no card silently mutates state and that the pause-first rule fires for edit_scope on a running job.
  - F1 - rewire the footer AiInputBar (codeless/ui/codeless-ui/src/app/App.tsx) to bind to the current assistant thread (last-used or pinned); messages from the footer appear in /assistant on next render; useChatStore loses message ownership (UI presentation state only, or retired); full-width cards stay on /assistant with a compact "open in /assistant to confirm" affordance from the footer.
  - Update DOCS/ASSISTANT-SCOPE.md - mark F2, F3, F1 as completed; verify R1-R5 hold (no process::Command outside codeless-adapters-host, no @tauri-apps imports in UI outside shells/desktop/, no per-shell UI files); run cargo test --workspace, cargo clippy --workspace --all-targets -- -D warnings, cargo fmt --check.
