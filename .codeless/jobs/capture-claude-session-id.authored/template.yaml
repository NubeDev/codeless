name: capture-claude-session-id
goal: "persist the Claude session id on the Stage row and surface it through list_stages so StageDetail can render it"

docs:
  - SCOPE.md
  - WORKFLOW.md
  - FEEDBACK.md
  - CHAT.md

stages:
  - title: "types: add session_id to Stage + StageRollup; add Event::StageSessionCaptured"
    docs:
      - SCOPE.md
  - title: "runtime: capture RunResult.session_id in StageRecorder; emit StageSessionCaptured; persist to stages.session_id"
    docs:
      - SCOPE.md
  - title: "UI: StageDetail shows the captured session id (no placeholder when present)"
    docs:
      - SCOPE.md
