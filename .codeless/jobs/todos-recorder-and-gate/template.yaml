name: todos-recorder-and-gate
goal: |
  Land the runtime + UI layers for the Todo feature whose types,
  events, SQLite schema, and store methods already merged. The
  Stages overview must render todo rows nested under ticks, the
  closing trio (checks / docs / git) must be runtime-injected at
  stage entry, and the runtime must refuse to emit StageCompleted
  until trio_resolved() returns true for the stage's terminal task.

stages:
  - StageRecorder persists todo events to SQLite
  - Trio injection at stage entry plus completion gate wired through state_machine
  - Verify, handover, and git steps emit TodoUpdated for their trio rows
  - REVIEW before runner integration — sanity-check the gate path under failure scenarios
  - Parse Claude Code TodoWrite tool calls into TodoAdded/TodoUpdated events
  - UI rendering — Stages tab shows todo rows per JOB-UI.md, glyphs driven by todo events
  - REVIEW before merge — end-to-end smoke with a real mock stage that exercises trio + UI
