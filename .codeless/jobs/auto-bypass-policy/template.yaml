name: auto-bypass-policy
goal: |
  Ship Surface F from DOCS/SCOPE-MUTABLE-UI.md: a per-job auto-
  bypass policy that lets the operator pre-authorise specific
  failure-handling at submit time and walk away. Five canned
  presets (Quick / Long-term / Cheap / Best-judgement / Just code)
  plus Custom free-text. When a stage fails under a policy, the
  runtime auto-bypasses with the policy's canned comment threaded
  into the next stage's prompt as guidance. Audit trail preserves
  every auto-bypass as Failed-with-bypass; two consecutive
  auto-bypasses with no Passed between halts the job with a
  thrashing-guard stop reason. Also ships the matching Slack
  command (Surface 4 in SCOPE-SLACK-INTEGRATION.md) so a policy
  can be set or changed from a phone.

  This is the hands-off complement to Surface E. Where E gives
  the operator a one-click bypass button, F removes the need to
  click at all when the operator already knows how they want
  that failure class handled.

docs:
  - CHAT.md

stages:
  - "Stage 0 decisions — resolve the open questions for Surface F into a new DOCS/AUTO-BYPASS-DECISIONS.md. Q1 thrashing window size (the doc says two; defend or contradict). Q2 policy-on-cap-breach (the doc forbids it; confirm and pin the failure mode for any future override request). Q3 policy-on-REVIEW-stage-that-proposed-a-patch (doc says save the patch via raw_tail, bypass the gate; confirm the order of operations). Q4 the exact canned comment strings for each preset (the doc names five but the wording is finalised in this stage so later code can const them). Q5 set_job_policy RPC semantics when called on a Running job (lean: refuse, require pause-set-resume; confirm). Q6 cross-doc dependency direction: Surface F builds on Surface E's bypass mechanism, which is co-shipping with another job in flight; pin which PR (the in-flight scope-mutable-ui Step 1, or a lifted-out small PR) lands first. No code changes in this stage."
  - "REVIEW decisions — confirm DOCS/AUTO-BYPASS-DECISIONS.md exists and answers all six Qs. Q4's exact wordings will be hard-coded into the runtime in stage 2; a wrong call there means a separate PR to fix the const string. Q6 in particular gates the order of subsequent stages — if Surface E's bypass mechanism is not yet on master, stage 2 must either wait or co-opt the in-flight branch."
  - "Stage 2 AutoBypassPolicy wire type and Job column — add AutoBypassPolicy enum to codeless-types per the doc's exact shape (Quick / LongTerm / Cheap / BestJudgement / JustCode / Custom(String)). Add the canned comment const &str values to codeless-runtime::auto_bypass_policy module (one per preset, per the Q4 decision from stage 0). Add auto_bypass_policy: Option<AutoBypassPolicy> column to the jobs table via a new migration. Update SubmitJobArgs to accept the policy at submit time; default None. Regenerate specta snapshot; update wire.ts. Mobile-safe: wire types in codeless-types, runtime impl in codeless-runtime."
  - "Stage 3 StageAutoBypassed event variant — add Event::StageAutoBypassed with the doc's exact shape {stage_id, policy_name, comment_used, applied_at}. Emit alongside the existing tracing log when the auto-bypass branch fires (added in stage 4). The event distinguishes auto-bypass from operator-clicked bypass; downstream consumers (UI gate panel, Slack notifications) read the policy_name to render the right badge / notification shape."
  - "REVIEW after wire types — confirm AutoBypassPolicy and StageAutoBypassed are mobile-safe (live in codeless-types, no codeless-runtime dependency), the canned comment strings are version-controlled as const &str (not config), the SubmitJobArgs field round-trips through serde, and the migration is reversible. This is the load-bearing wire-format review; getting it wrong now means a schema_version bump later."
  - "Stage 5 stage-failed handler auto-bypass branch — in codeless-runtime::template_runner, where today a failing stage emits JobFailed and aborts, add a branch that reads job.auto_bypass_policy. If Some(policy) and the failure is NOT a cap breach (stop_reason CostCap or WallClockCap), mark the stage Failed with bypassed_at + bypassed_reason = policy.canned_comment(), emit StageAutoBypassed event, set next_stage_comment to the canned comment, advance to the next stage. If None or cap breach, halt as today. Reuses the next_stage_comment plumbing from the Slack integration doc's Dependency #2 — if that field is not yet on ResumeJobArgs / the prompt assembly path, this stage must add it as a prerequisite."
  - "Stage 6 thrashing guard — track the last two stage outcomes per job in an ephemeral in-memory map keyed by job_id. If both are Failed-then-auto-bypassed with no Passed between, halt the job with stop_reason: AutoBypassThrashing instead of auto-bypassing. The map is rebuilt from the store on driver startup so a restart does not lose thrashing state. Unit test the two-strikes rule, the reset-on-pass behaviour, and the cap-breach-bypasses-the-guard case (cap breach already halts; thrashing guard is dead code for that path)."
  - "REVIEW after runtime branch — submit a smoke test job to the smscope-test repo with policy: JustCode that has a stage scripted to fail. Confirm: (a) the failing stage row is Failed with bypassed_at set, (b) the StageAutoBypassed event fires, (c) the next stage's prompt prefix includes the JustCode canned comment, (d) a job with two consecutive failures under the same policy halts with AutoBypassThrashing. This is the live-runtime gate; passing it means the runtime side is production-shaped."
  - "Stage 8 submit-form preset picker — add a select / dropdown to the JobsDashboard submit-job dialog (or the Spec pane's job-create surface, whichever the UI uses today) with the six options (None plus the five presets) and a free-text input for Custom. Default to None per the doc's anti-pattern. On submit, pass the policy through SubmitJobArgs. UI imports RpcClient only (R2). No per-shell file split (R3)."
  - "Stage 9 policy badge on JobPage header — small read-only pill showing the current policy (e.g. 'policy: Quick' or no badge when None). Render component reads job.auto_bypass_policy from the get_job result. Click-through opens a small modal that calls set_job_policy when the job is not Running. The badge is the visible reminder that this job is hands-off; without it the operator forgets they set a policy."
  - "Stage 10 set_job_policy RPC — server-side mutator. Per Q5 from stage 0 (lean: refuse on Running), only permit when status is Draft / Stopped / Paused. Idempotent; same-policy-set is a no-op success. Emits a JobPolicyChanged event for cross-window invalidation."
  - "Stage 11 muted auto-bypass notifications in the JobPage timeline — the timeline already renders StageStarted / StageCompleted / AiMessageComplete. Add a StageAutoBypassed render with a distinct icon (down-arrow-with-check rather than red-X) and the policy name + canned comment as the hover. Surface A's gate panel reads StageAutoBypassed to render the auto-bypassed verdict badge."
  - "Stage 12 Slack integration Surface 4 — the @codeless policy <job-id> [<preset> | custom \"<text>\" | none] command. Slack-side parser; calls set_job_policy. The muted auto-bypass notification format from SCOPE-SLACK-INTEGRATION.md Surface 4. This stage co-ships with the rest of the Slack integration job, but the policy command's Slack-side scaffolding is small enough to land here as a stub the Slack job will then wire up properly. (If the Slack integration job is not yet started, mark this stage [!] and skip; the Surface F runtime + web UI is the load-bearing part.)"
  - "REVIEW final — walk every Stopping point in SCOPE-MUTABLE-UI.md Step 7 and confirm the artifact. AutoBypassPolicy wire type and column ship. StageAutoBypassed event fires on auto-bypass and never on operator-clicked bypass. The five canned comments are version-controlled as const &str. The submit form has the preset picker and defaults to None. The JobPage badge renders the current policy. The thrashing guard halts after two consecutive auto-bypasses. Cap breaches are NEVER auto-bypassed. A REVIEW stage that proposed a SCOPE patch via raw_tail preserves the patch even when auto-bypassed. R1/R2/R3/R4/R5 unchanged. cargo test --workspace, cargo clippy --workspace --all-targets -- -D warnings, cargo fmt --check all green."
