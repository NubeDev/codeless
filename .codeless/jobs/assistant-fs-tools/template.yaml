name: assistant-fs-tools
goal: |
  Give the in-app Assistant filesystem read/write access so it can
  draft, inspect and refine Codeless jobs informed by the actual
  repository contents. Ship a three-mode permission model
  (read-only / approve-edits / bypass) per assistant thread,
  vocabulary aligned with Claude Code, Copilot CLI and Codex so
  users carry one mental model across tools. Writes under
  `.codeless/jobs/<name>/` always route through `jobs.updateScope`
  regardless of mode, so the paused-job rule cannot be bypassed.

stages:
  - resolve open questions in SCOPE.md — confirm the three mode names (bias read-only / approve-edits / bypass to match Claude Code), confirm thread-mode storage (column on assistant_threads), confirm the .codeless/jobs/<name>/ special case routes through jobs.updateScope even in bypass; record decisions in SCOPE.md
  - REVIEW prerequisite decisions before code lands
  - add `mode` column to assistant_threads (migration, default 'read-only'); add assistant.setThreadMode(thread_id, mode) RPC; round-trip tests
  - implement read-only fs tools (fs.list, fs.read, fs.search) in codeless-tools with a workspace-root path sandbox that rejects absolute paths and `..` traversal; register on the planner's tool registry for assistant threads only; per-tool unit tests plus an integration test using MockRunner
  - REVIEW read-only end-to-end before write paths land
  - implement write fs tools (fs.write, fs.edit) gated by thread mode; `approve-edits` surfaces each write as an AssistantActionCard the user confirms via the existing confirm_assistant_action dispatcher; `bypass` writes through; writes under `.codeless/jobs/<name>/` route through `jobs.updateScope` in every mode; tests for each mode and for the job-scope special case
  - UI — mode dropdown in the /assistant context panel (right rail per ASSISTANT-SCOPE §1) calling assistant.setThreadMode; display reflects server state (R4); pnpm typecheck green
