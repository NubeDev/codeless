name: slack-integration
goal: |
  Build a Slack integration that lets the operator drive Codeless jobs
  from a phone. Surface 1: status, start, stop, resume (with bypass
  and comment args), plus outbound failure notifications. The bot is a
  new codeless-slack crate (host-only), behind --enable-slack on the
  serve CLI.
stages:
  - "Add bypass and next_stage_comment fields to ResumeJobArgs in codeless-rpc; thread next_stage_comment into prompt assembly in codeless-runtime template_runner; add actor field to JobResumed event"
  - "Scaffold codeless-slack crate (host-only); Slack Socket Mode connection; bot user token from secrets store; CLI --enable-slack flag plumbing"
  - "Implement command parser for Surface 1 grammar: status, start, stop, resume with bypass/comment; thread-context job-ID resolution"
  - "Wire parsed commands to RpcClient calls; format and post synchronous command replies"
  - REVIEW after command surface is working end-to-end
  - "Subscribe to event bus; post outbound failure notifications on JobFailed and JobStopped with structured format; per-job 5-minute debounce"
  - "Surface 2: enrich failure notifications with REVIEW gate context (ReviewPreCheck / ReviewVerdict event data) when available"
  - REVIEW before shipping — verify keep-it-running loop is end-to-end from phone
