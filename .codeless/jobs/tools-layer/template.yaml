name: tools-layer
goal: |
  Land Phase 1 of TOOLS-PORTING.md: a real codeless-tools crate with a
  Tool trait, ToolCtx, a registration mechanism, codeless-mcp wired to
  serve registered tools over MCP, codeless-side policy types, NOTICE,
  SCOPE.md updates, and one ported tool (browse.fetch) proving the
  shape end-to-end. This is item 1 of PLUGIN-SUBSTRATE.md and the
  strict prerequisite for the rest of that doc.

docs:
  - CHAT.md
stages:
  - T1 (S) new codeless-tools crate as workspace member, host feature wired, empty lib.rs with crate docs, workspace builds clean
  - T2 (M) Tool trait, ToolCtx, ToolError, registration mechanism, testing::fake_ctx() harness with no tool impls yet
  - REVIEW Tool surface (trait + ToolCtx) frozen before any callers depend on it
  - T3 (M) codeless-mcp integration accepting a ToolRegistry at startup, advertising registered tools, dispatching MCP calls into tool.call
  - T4 (M) codeless-side NetworkMode + AllowlistFile policy types, NOTICE file with moxxy MIT notice, SCOPE.md crate table updated to add codeless-tools with R1 enforcement note
  - T5 (M) port browse.fetch from moxxy-runtime as the first real tool with provenance comment, schema declared inline, integration test using the T2 harness, ai-runner naming collision resolved
  - REVIEW Phase 1 acceptance review before declaring substrate item 1 done and unblocking PLUGIN-SUBSTRATE items 2-8
