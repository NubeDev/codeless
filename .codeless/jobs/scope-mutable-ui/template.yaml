name: scope-mutable-ui
goal: |
  Build the user-facing surface of SESSION-MUTABLE-SCOPE per
  DOCS/SCOPE-MUTABLE-UI.md. PR #12 shipped the runtime ramp;
  PR #13 fixed two regressions surfaced by smoke-testing. The
  whole "human becomes editor of the rulebook" role still has
  zero UI surface — REVIEW gate diagnostics live in server logs,
  ScopePatch events flow over SSE with no component rendering
  them, and the codeless patches CLI is the only way to act on a
  proposal. Ship the doc's 5-step ramp end-to-end: Surface A
  (REVIEW gate panel) → handover schema fix → Surface B
  (per-job patch inbox) → Surface C (cross-workspace worklist)
  → Surface D (rule maturity badge). Each step is an
  independently useful stopping point per the doc's "Stopping
  points" section.

docs:
  - CHAT.md
stages:
  - "Stage 0 decisions — read DOCS/SCOPE-MUTABLE-UI.md end-to-end and resolve the six open questions into a new DOCS/SCOPE-MUTABLE-UI-DECISIONS.md. The doc resolves OQ#1 (split A from B) and proposes positions on OQ#2-#6; record those decisions explicitly so later stages cite a single source of truth. Also confirm the dependency table is internally consistent with the per-surface Status blocks. No code changes."
  - "REVIEW decisions — confirm DOCS/SCOPE-MUTABLE-UI-DECISIONS.md exists, all six OQs answered, and the recorded decisions match the doc's Risk + Status sections. A wrong call on OQ#3 (modal policy) or OQ#5 (D health-vs-maturity split) cascades through stages 3-5."
  - "Step 1 Dependency #1 — ReviewPreCheck + ReviewVerdict events in codeless-types. Add the two Event variants per the doc's exact shape (PreCheckOutcome enum {Pass{verified}, Fail{missing}, Skipped, NothingToVerify}; ReviewVerdict enum {Pass{reason}, Fail{reason}, AutoFail{reason}}). Mobile-safe. Emit them from template_runner.rs wherever the existing tracing::info!/warn! calls fire — do not change the log lines; add events alongside. Regenerate specta snapshot; update wire.ts."
  - "Step 1 Surface A — ReviewGatePanel React component on StageDetail.tsx, rendered when stage.is_review is true. Renders the pre-check outcome (path-by-path verified or missing-with-candidates), the verdict + reason, and a 'Patches proposed: N' counter ONLY if Dependency #2 has shipped (gate the row on a feature flag the runtime sets when handover round-trip preserves SCOPE-PATCH markers — until #2 lands, omit the row rather than ship one that lies). No new RPCs; consume events via the existing useEventStream. Per the doc: do not duplicate the existing handover preview here; A is a summary surface."
  - "REVIEW Step 1 — confirm gate diagnostics render end-to-end on a real REVIEW stage's detail pane. Use the smscope-test repo (already registered) to drive a small job through one REVIEW gate. Pre-check pass case AND pre-check fail case (provoke by claiming a path the diff lacks). Verify the panel does NOT show the Patches counter (Dep #2 has not landed). This is the Risk-1 stopping point: diagnostics ship without action."
  - "Step 2 Dependency #2 — extend codeless-types::Handover with raw_tail: Option<String>. Thread through from_markdown (capture everything after the four canonical sections verbatim) and to_markdown (append raw_tail after Open questions). Backwards-compat: missing raw_tail in deserialised JSON treats as None. Bump the wire schema_version. Update scope_patch_emit::emit_from_handover to read from the on-disk file unchanged (already does). Add a serde round-trip test plus a regression test: a Handover with a SCOPE-PATCH-BEGIN/END block in raw_tail must survive parse-then-serialise."
  - "Step 3 Dependency #3 — approve_scope_patch, reject_scope_patch, edit_scope_patch RPCs. Each wraps the existing codeless-cli/src/patches.rs logic. Per the doc: idempotent (AlreadyResolved {resolution, commit_sha} result on second call, not an error), author identity resolved server-side from repo-local git config user.{name,email} with a Codeless-Approved-By: ui trailer, and each emits a ScopePatchApproved or ScopePatchRejected event (new variants in codeless-types, same shape as ScopePatchProposed). Mobile-safe wire types in codeless-types; impl in codeless-runtime."
  - "Step 3 Surface B — Patches tab in JobTabs SystemTabId, hidden when the job has emitted zero ScopePatchProposed events. Card layout per the doc's ASCII mockup: kind badge, target file, rationale, evidence stage link, predicate-shipped flag, Proposed timestamp, Approve/Reject/Edit buttons. UX per OQ#3 resolution: Reject = no modal, plain Approve = no modal + 10s undo toast with commit sha + one-click revert, Approve-after-Edit = modal showing diff between original proposal and edited text. Edit opens CodeMirror on the patch entry; on save the parser revalidates and surfaces parse errors inline."
  - "REVIEW after per-job action loop — confirm Steps 1-3 compose end-to-end. Submit a job that proposes a patch, observe the proposal land in DOCS/SCOPE-PROPOSED.md (Dep #2 now preserves the block), open the Patches tab, exercise Approve / Reject / Edit-then-Approve. Verify the resulting commit's author matches the repo-local git config, the body cites the evidence stage, and the trailer reads Codeless-Approved-By: ui. Confirm idempotency by clicking Approve twice in two windows."
  - "Step 4 Dependency #4 — list_proposed_patches(repo_id?) RPC. Wrap scope_patch_queue::load_queue. Lift the Proposal DTO into codeless-types per R1; impl stays in codeless-runtime. SUB-DEPENDENCY: scope_patch_queue::Proposal currently has no creation timestamp; add one at proposal-emit time (Surface C's age filter and 14-day-decay sort depend on it). Without the timestamp, Surface C ships without the decay sort and the doc's 'older than 14 days falls below the fold' default is dropped."
  - "Step 4 Surface C — /patches top-level route in app/App.tsx, peer of /jobs and /assistant. New module ui/codeless-ui/src/modules/patches/ with the per-job card component reused. Filters: kind (Tighten/Loosen/Add/Predicate-only), target file, age. Group-by: repo (workspace-attach can register multiple), target file. Default sort: newest first, grouped by target file. Cross-window: approving in JobPage's Patches tab invalidates the /patches worklist via cross-window-events.ts. Count badge in the global nav."
  - "Step 5 Dependency #5 + Surface D — enforced_by: annotation convention in DOCS/SCOPE.md and DOCS/CLAUDE.md (HTML-comment syntax per the doc's example). Seed five real rules with annotations pointing at the existing codeless-predicates probes. Render component on the Markdown viewer: three states per the doc — green pill (annotation present + file exists), grey pill (no annotation, advisory), red/warning pill (annotation present but cited file missing or unreadable). The third state catches the predicate-renamed silent-failure mode; do not auto-derive."
  - "REVIEW final — confirm the ramp landed at Step 5 stopping point. Walk every Stopping point in DOCS/SCOPE-MUTABLE-UI.md and verify the artifact: Step 1 panel renders both pass and fail cases; Step 2 raw_tail round-trips a SCOPE-PATCH block; Step 3 Approve/Reject/Edit all produce commits with the right author and trailer; Step 4 worklist groups and filters as specified; Step 5 badge shows all three states. Confirm R1 (process spawn confined), R2 (UI imports RpcClient only — no @tauri-apps/* in any of the new modules), R3 (no per-shell UI files), R4 (no new SQLite table for patches — DOCS/SCOPE-PROPOSED.md plus git history remain the artifact), R5 (single-tenant trust unchanged — author identity from repo config, no per-user auth). Confirm wire formats untouched (JOB-MODEL.md, JOB-LOOP.md). Confirm the deliberately-not-included list still holds (no auto-merge, no manual patch generation in UI, no rerun-review-button, no patch-history view in app, no separate audit log, no in-UI edit of SCOPE.md/CLAUDE.md outside the patch flow). Confirm cargo test --workspace, cargo clippy --workspace --all-targets -- -D warnings, cargo fmt --check all green."
