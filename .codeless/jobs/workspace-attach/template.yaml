name: workspace-attach
goal: |
  Implement milestones 1 and 2 of DOCS/WORKSPACE-ATTACH.md: resolve the
  four open questions, add the attached_workspaces table with the
  idempotent boot upsert, add the four typed RPC methods
  (attach_workspace, detach_workspace, list_workspaces,
  validate_workspace_path) behind the bearer gate, and switch the host
  adapter from a single Option<PathBuf> fs_root to a canonical
  allowed-roots list. UI work (milestones 3-6) is a follow-up job.

stages:
  - resolve the four open questions in DOCS/WORKSPACE-ATTACH.md §"Open questions"; record each decision and its reasoning in SCOPE.md before any code lands (S)
  - REVIEW the four decisions before implementation begins
  - add the attached_workspaces table (canonical + display columns, unique index on canonical) and the idempotent boot upsert from --fs-root, with tests covering canonicalisation collapse (/a/b, /a/b/, symlink-to-/a/b all become one row) (M)
  - add the wire types in codeless-types — AttachWorkspaceArgs/Result, AttachedWorkspace, DetachWorkspaceArgs, DetachPolicy, ListWorkspacesResult, ValidateWorkspacePathArgs/Result, WorkspaceProblem, WorkspaceError — with specta derives; iOS/Android-safe (no host deps) (S)
  - implement the four RPC methods end-to-end in codeless-rpc + codeless-runtime with a cargo test round-trip attach → list → detach, plus the structured WorkspaceError variants so the UI does not have to string-match (L)
  - switch the host adapter (codeless-adapters-host) from Option<PathBuf> fs_root to a canonical allowed-roots list; existing fs.* RPCs continue to work and reject paths outside the attached set with PermissionDenied (M)
  - add the 30s liveness sweep in the host adapter emitting workspace_unhealthy / workspace_recovered events over RpcClient.subscribe(); freeze ServerInfo.fs_root to the boot-time value (S)
  - REVIEW server-side milestone complete; flag UI integration as a follow-up job
