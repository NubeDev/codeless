name: scoped-pause-points
goal: |
  Let the operator pre-declare pause breakpoints in template.yaml so the
  runner auto-pauses at exact spots in the plan (before stage 2,
  before stage 3 todo 1, after stage 5's checks todo, etc.) without any
  runtime click. Breakpoints persist in SQLite alongside the stage rows,
  surface in the Stage overview and chat as a planned divider, and use
  the existing pause_job state machine (JobStatus::Paused, JobPaused
  event, resume_job) — this job adds the scheduling layer, not a new
  pause primitive.

stages:
  - "design: extend template.yaml schema with a pause_points: list (each: stage ordinal or stage name; optional todo ordinal or todo kind from TRIO; position before|after; optional reason string). Record the grammar, examples, and the parser's rejection rules in DOCS/SCOPED-PAUSE-POINTS.md and SCOPE.md before any code (S)"
  - REVIEW the schema + rejection rules before implementation begins
  - "wire types in codeless-types: PausePoint, PausePointPosition (Before/After), PausePointTarget (Stage{ordinal}|StageTodo{ordinal,kind_or_todo_ordinal}), with specta derives; iOS/Android-safe (no host deps). Round-trip serde test (S)"
  - "template parser: extend the template.yaml loader in codeless-runtime to accept pause_points, resolve symbolic stage names to ordinals against the parsed stage list at submit time, reject unknown stages/todos/positions with a typed ScopeError before the job leaves draft (M)"
  - "persistence: add scheduled_pause_points table keyed on (job_id, ordinal) with one row per declared point; idempotent rebuild on resync_template_from_disk so chat-driven template edits adjust the schedule (M)"
  - "runtime hook: in the stage/todo state-machine transitions in codeless-runtime, before-transition checks the schedule; if a point matches, call the existing pause_job entry point with StopReason::ScopedPausePoint{point_id} and emit JobPaused before advancing. The trio's checks/docs/git todos stay schedulable targets so 'pause after stage 3 docs' works (L)"
  - REVIEW server-side complete — runner pauses at the declared points; resume_job advances past one point at a time
  - "UI: stage overview renders a planned-pause divider chip at each scheduled point (distinct from a runtime pause); chat shows a 'paused at <human label>' divider when JobPaused fires with StopReason::ScopedPausePoint; resume button is the same surface, no new RPC. Playwright test covers the divider rendering + resume click (M)"
  - REVIEW UI landed; flag follow-ups (edit-points-from-UI, recurring breakpoints) in SCOPE.md
