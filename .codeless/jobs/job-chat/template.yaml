name: job-chat
goal: |
  Land the per-Job chat substrate from DOCS/JOB-CHAT.md on master via
  codeless/job-chat: a single SQLite-backed chat thread per Job that
  every transport (web, Telegram, Slack, CLI) reads and writes through
  the same RPCs, plus a long-lived supervisor agent in
  codeless-runtime that watches the Run and replies in that thread,
  plus action tools and pre-armed deadline / threshold goals. The
  three phases in the doc (C1 unified chat, C2 read-only supervisor,
  C3 action tools + supervisor_goals) ship as one job with REVIEW
  gates at the C1/C2 and C2/C3 boundaries. Echo suppression on
  outbound is asymmetric (origin-transport skips its own row;
  non-origin transports forward and write a delivery receipt into
  metadata_json) and is enforced by an integration test, not just
  prose. The supervisor lives as a module inside codeless-runtime,
  never a separate crate (Hard rule 2 of JOB-CHAT.md, R1 of CLAUDE.md);
  it never imports tokio::process or std::process; its only voice is
  post_chat_message. Pre-armed actions fire immediately when their
  condition trips (the user already authorised the if-X-then-Y), with
  the post-action summary as the audit trail; ad-hoc destructive
  actions get a 5-second preview window. The "if it runs >1h, stop
  it" example must work end-to-end and survive a server restart, which
  forces supervisor_goals rehydration on supervisor boot. Slack
  adapter parity with Telegram is in scope (same chat_bindings shape).

docs:
  - CHAT.md
stages:
  - "stage 1: resolve open questions (OQ-CHAT-1..5 from JOB-CHAT.md §Open questions; final v0.1 transport set + the wire-name convention for ChatTransport) under SCOPE.md §Open questions and propagate the resolutions into JOB-CHAT.md inline; no implementation"
  - "stage 2: schema — add codeless-runtime/migrations/0024_chat_messages.sql (chat_messages + chat_messages_job_idx + the partial-unique chat_messages_external_idx) and 0025_chat_bindings.sql (chat_bindings with thread_id NOT NULL DEFAULT '' as the no-thread sentinel), with row-level docs explaining the NULL-vs-empty-string sentinel and why the unique constraint is partial; the existing migration matrix test loads both migrations cleanly on a fresh DB and replay-idempotent on a populated one"
  - "stage 3: wire types in codeless-types (mobile-safe) — ChatMessage, ChatTransport, ChatRole, ChatBinding plus their specta::Type derives; MessageId newtype; specta wire snapshot regenerated; cargo test -p codeless-types green"
  - "stage 4: RPC surface — post_job_message, list_job_messages, bind_chat_thread in codeless-rpc::RpcServer with ResultEnvelopes lifted from the existing add_repo / list_jobs pattern; impls in codeless-runtime::rpc::chat backed by a new codeless-runtime::store::chat module; unit tests pin the post → list round-trip, the bind upsert idempotency, and the partial-unique-index conflict path"
  - "stage 5: events on the existing bus — ChatMessageAppended { job_id, message } and ChatBindingCreated { transport, channel_id, thread_id, job_id } added to codeless-types::Event with the kebab-case rename + serde-default + skip-serializing-if-none style the existing variants use; StageRecorder gains no responsibility here (chat is its own write path); the post_job_message impl publishes ChatMessageAppended after the INSERT; integration test asserts a single ChatMessageAppended per post call and replay-after-recorder-restart is a noop"
  - "REVIEW M-C1-A — chat substrate compiles end-to-end: migrations land, wire types regen clean, RPCs pin behaviour, events fire on insert; no transport-side code yet"
  - "stage 6: Web UI — rewrite ui/codeless-ui/src/modules/jobs/ChatTab.tsx over the new RPCs; remove the existing transport-local message store (whatever shape it has today) and replace its in-memory list with a SWR-style cache keyed on job_id that rehydrates from list_job_messages on mount and appends from ChatMessageAppended on the SSE stream; pnpm -C ui/codeless-ui test green; the new vitest chat_tab_round_trips_a_post adds a fixture RpcClient and asserts the message input → post_job_message → ChatMessageAppended → render loop without touching the network"
  - "stage 7: Telegram adapter — codeless-telegram inbound writes via post_job_message with transport='telegram' and the platform message id as external_id; outbound subscribes to ChatMessageAppended and forwards every non-telegram-origin message via the Bot API, then writes the delivery receipt to chat_messages.metadata_json.delivery.telegram via a new update_chat_message_delivery store method (no UPDATE on body / external_id ever, per JOB-CHAT.md immutability bias); /codeless bind <job_id> writes to chat_bindings; idempotency is presence-based on metadata.delivery.telegram"
  - "stage 8: cold-load + echo-suppression — on /codeless bind, the Telegram adapter calls list_job_messages with the small N-tail and posts a single condensed 'joining mid-thread' summary; the asymmetric echo-suppression rule moves into a shared helper in codeless-bot-core (origin-transport skip, non-origin forward + receipt), with bot_chat_e2e::origin_transport_skips_self_post and bot_chat_e2e::cross_transport_forwards_with_receipt as the load-bearing tests against an in-memory bus + a CannedTelegramApi"
  - "REVIEW M-C1-B — C1 end-to-end: a message typed in the web UI CHAT tab appears in a bound Telegram thread within one event tick (and vice versa); the punch list in JOB-CHAT.md §C1 punch-list is fully ticked off; JOB-CHAT.md status updated to record C1 as shipped; no supervisor yet"
  - "stage 9: supervisor module scaffold — codeless-runtime::supervisor (module, not crate; R1 by construction); spawned by drive_job when the Run enters Running; subscribed to ChatMessageAppended filtered to its job_id; cancelled on Run terminal status (Completed / Failed / Stopped / AwaitingReview is not terminal); a fresh Run spawns a fresh supervisor; supervisor_e2e::supervisor_spawns_on_run_start_and_exits_on_run_terminal green; the supervisor's only outbound voice is post_job_message with transport='supervisor', which is enforced by grep + a clippy-style lint rule in the module's mod.rs (no eprintln, no tracing::info that surfaces to user, no direct event publish)"
  - "stage 10: supervisor tool surface (read-only) — get_job_state, read_events, read_handover, read_template, read_stage_log, read_notes; plus the single write tool post_chat_message; each tool routes through existing RPCs / store reads so the supervisor never imports tokio::process or std::process (enforced by grep test in supervisor/mod.rs); supervisor_e2e::supervisor_answers_what_stage_is_it_on green using the mock runner + canned event timeline"
  - "stage 11: supervisor model + prompt — wire the supervisor's Claude session via the existing claude runner under a host-only feature flag; system prompt + tool descriptions live in supervisor/prompt.rs so they are reviewable as text; on Run terminal status the supervisor posts a one-paragraph summary referencing the stage names and visible failure_detail then exits; the prompt is short enough that a typical reply costs <2c at current pricing"
  - "REVIEW M-C2 — C2 end-to-end: with a Run in Running state, typing what-stage-is-it-on in the web CHAT tab gets a real supervisor reply within a few seconds that references the current stage name and the most recent ai-token; supervisor_e2e is green; JOB-CHAT.md status updated to record C2 as shipped"
  - "stage 12: action tools — stop_job and add_job_note in supervisor/tools/actions.rs; both route through existing RPCs and emit the same JobCancelled / JobNoteAdded events the UI buttons produce, with the events row's actor='supervisor' so the audit trail tells you which surface triggered; ad-hoc preview window is a 5-second tokio::time::sleep with a cancellation check on a fresh ChatMessageAppended from a user role containing /^wait\\b/i; supervisor_e2e::ad_hoc_stop_aborts_on_user_wait and supervisor_e2e::ad_hoc_stop_fires_after_window green"
  - "stage 13: supervisor_goals migration + store — codeless-runtime/migrations/0026_supervisor_goals.sql with the columns from JOB-CHAT.md §C3 (id, run_id, kind, condition_json, action_json, authorised_by, status, created_at, fired_at); codeless-runtime::store::supervisor_goals with insert_goal / list_armed_for_run / mark_fired / mark_cancelled / mark_superseded; goal_kinds in v0.1 = deadline-stop, threshold-stop, event-notify; condition_json and action_json validated against a typed enum at write time; pause_after_stage is parsed but produces a structured Failed (no-op until JOB-WORKFLOW (A.5))"
  - "stage 14: pre-armed action loop — supervisor watches its goals via a select! loop combining the event bus, a deadline timer, and a tokio::time::sleep_until per armed goal; on fire, the action invokes immediately (no preview, per Hard rule 4 of JOB-CHAT.md) and the supervisor posts the 'I just did X because Y' summary as a chat row referencing the authorising chat_messages.id; supervisor_e2e::deadline_stop_fires_at_t_plus_one_hour green using a tokio time-driver pause + advance"
  - "stage 15: goal rehydration on supervisor boot — a supervisor that starts (or restarts after a server bounce mid-Run) scans armed rows for its run_id, re-arms timers / event watchers, marks rows whose condition no longer makes sense as Superseded with the reason; supervisor_e2e::supervisor_rehydrates_deadline_after_restart green (drop the supervisor mid-run, spawn a fresh one, advance time, assert the goal still fires)"
  - "stage 16: Slack adapter parity — new codeless-slack crate following the codeless-telegram shape; same chat_bindings.transport='slack' rows; the shared echo-suppression + outbound-receipt helper in codeless-bot-core is the only thing that needs to know two transports exist; slack_chat_e2e mirrors bot_chat_e2e against a CannedSlackApi"
  - "REVIEW M-C3 — C3 end-to-end: if-this-runs-more-than-an-hour-stop typed in any surface arms a supervisor_goals row; advancing the clock past the hour fires stop_job; the post-action summary lands in chat with the authorising message id; restarting the server mid-Run rehydrates the goal; Slack and Telegram both round-trip messages with no double-render; JOB-CHAT.md §Open questions updated with the resolutions reached in stage 1"
  - "stage 17: documentation + handover — JOB-CHAT.md Status rows for C1, C2, C3; resolved-OQ updates inline; CODELESS.md 'What works today' lines for the three landed surfaces; final cargo test --workspace + cargo clippy --workspace --all-targets -- -D warnings + cargo fmt --check + pnpm -C ui/codeless-ui lint + pnpm -C ui/codeless-ui test green; one paragraph in the job handover summarising what's deferred (mcp_forward parity from PLUGIN-MCP is unrelated; mobile-shell wiring of chat surfaces is Phase 6; multi-user trust is Phase 7 OIDC)"
