name: assistant-parity
goal: |
  Land the three workstreams in DOCS/SCOPE-ASSISTANT-PARITY.md so the
  /assistant surface matches the in-job chat in behaviour, the new-job
  composer is reused by the planner's draft_job card, and the planner
  can recommend / change auto-bypass policy through the same card
  surface. Per-stage worklist is in
  .codeless/jobs/assistant-parity/SCOPE.md; per-stage discipline and
  REVIEW gates are in .codeless/jobs/assistant-parity/WORKFLOW.md.
  Read both before starting stage 1.

docs:
  - CHAT.md
stages:
  - W2a embed JobComposer in the assistant draft_job action card
  - W2b round-trip test for planner-seeded draft through user edits to submit_job
  - REVIEW before W1 — composer parity verified before the renderer rewrite begins
  - W1a lift streaming and Streamdown and tool-card chrome out of JobChat into CommonChat
  - W1b shrink JobChat and AssistantThreadView to wrappers that supply a history-loader prop
  - W1c retire focusStore refreshTick once the rail subscribes to the planner thread-touched envelope
  - W1d parity test asserts identical message-list DOM for job vs assistant threads
  - REVIEW before W3 — shared renderer and composer must be stable before policy cards land
  - W3a extract POLICY_PRESETS to ui/codeless-ui/src/lib/policy/presets.ts and Rust mirror
  - W3b planner prompt builder consumes the preset list, snapshot test covers all seven variants
  - W3c draft_job card embeds the policy picker, update card dispatches set_job_policy with paused-job rule
  - W3d failure-time set_policy card emitted on stage halt under None policy
  - REVIEW before merge — end-to-end smoke runs the SCOPE-ASSISTANT-PARITY.md Acceptance list
