name: adapter-registry
goal: |
  Implement stage 1 of DOCS/WORKSPACE-ATTACH.md §"TODO — adapter
  registry" — replace boot-time --enable-slack / --enable-telegram /
  --enable-claude / --enable-anthropic / --enable-codex /
  --enable-copilot CLI flags with a UI-driven Settings → Adapters
  surface backed by SQLite, where toggling an adapter or runner
  triggers a graceful server restart. Outcome: the user enables /
  disables / reconfigures any chat adapter or AI runner from the UI,
  the server reboots itself, and jobs resume from their last
  checkpoint. Gmail-adapter and stage 2 (hot-reload) are explicit
  follow-up jobs and out of scope here.

stages:
  - resolve the open questions recorded in SCOPE.md §"Open questions" (composite-vs-single PK, --respawn-on-exit default, validate-cache lifetime, kill-vs-resumable partition rule); record each decision and one-line reasoning in SCOPE.md before any code lands (S)
  - REVIEW the decisions before implementation begins
  - add the SQLite tables — chat_adapters((kind, instance_id) PK, enabled, configured_at), runner_config(runner_id PK, enabled) — plus the boot-time read that replaces the CLI flag wiring in codeless-cli/src/serve.rs; --enable-* flags become idempotent upserts (same shape as --fs-root → attached_workspaces); migration test in tests/migrations.rs (M)
  - extend the SecretStore behind a SecretBackend trait — keep the XDG TOML backend as the default, add the keyring-crate backend (Secret Service / Keychain / Credential Manager) behind a config flag, and write the write-then-fsync-then-restart ordering test that crashes the process between secrets-write and the restart signal (L)
  - add the wire types in codeless-types and codeless-rpc — ChatAdapterKind, ChatAdapterRow, RunnerRow, ListChatAdaptersResult, SetChatAdapterEnabledArgs, ValidateChatAdapterSecretsArgs/Result, ListRunnersResult, SetRunnerEnabledArgs, RestartServerArgs/Result, MissingSecrets / ValidationFailed / RestartUnsupervised / RestartHasRunningJobs error variants — specta derives, iOS/Android-safe (S)
  - implement the four chat-adapter RPCs (list/set_enabled/validate/with the validate-before-enable coupling) and the two runner RPCs (list/set_enabled) end-to-end in codeless-rpc + codeless-runtime; cargo test round-trips list → validate → set_enabled → restart-arms; per-(kind, instance_id) rate limit (5/s); 5s hard timeout on validate calls (L)
  - implement restart_server — three contexts (supervised CLI exits 75 EX_TEMPFAIL, Tauri desktop sidecar kill-and-respawn, bare CLI returns RestartUnsupervised); add codeless serve --respawn-on-exit (self-watcher parent that re-execs the child on exit-75) so the bare case Just Works; partition running jobs into resumable vs killed and return RestartHasRunningJobs unless force=true; integration test asserts the partition (M)
  - lift the Slack and Telegram adapter spawn calls out of codeless-cli/src/serve.rs into a boot-time ChatAdapterRegistry driven by the chat_adapters table; lift the DefaultRunnerFactory enable_* fields out of serve.rs into a RunnerConfig driven by the runner_config table; the --enable-* flags continue to work as upsert shims; no behavioural change beyond the source of truth (M)
  - REVIEW server-side milestones complete; flag Gmail adapter and stage 2 (hot-reload) as separate follow-up jobs
