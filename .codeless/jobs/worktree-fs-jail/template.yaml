name: worktree-fs-jail
goal: |
  Fix the "agent_chat cwd is outside the configured fs roots" error
  that fires the moment a user opens the per-job chat panel for any
  job whose worktree lives under ~/.codeless/worktrees/. Same gap
  affects codeless-cli serve and codeless-tauri-desktop; both hosts
  must register their worktree root with HostFs at boot, alongside
  the existing attached_workspaces rehydration. After this job, the
  chat panel opens against any running job without an fs-jail
  rejection, and a regression test pins the boot behaviour so the
  bug cannot silently come back.

stages:
  - "stage 1 — confirm reproduction and lock the fix shape: re-read BROWSER-LAUNCHER.md 'Known issues — Worktree root is not in the fs jail', verify the symptom against the running server (open a job's chat panel; observe the exact 'invalid_argument: agent_chat cwd is outside the configured fs roots' rejection), grep the two call sites named in the doc (codeless-cli/src/serve.rs ~line 413 after the attached_workspaces rehydration block, and codeless-tauri-desktop/src/boot.rs after its rehydration loop and before with_fs), record the exact line numbers as they exist on this branch in the handover so stage 2 is mechanical"
  - "stage 2 — land the fix in both hosts: add host_fs.add_root(&worktree_base) (or the equivalent for the CLI's worktree_root_effective) to both serve.rs and boot.rs, after std::fs::create_dir_all guarantees the directory exists and before the runtime is wrapped with the host_fs; both hosts share the same fix shape; surface FsRoot errors the same way the surrounding code already does (BootError::FsRoot in boot.rs, anyhow context in serve.rs); no drive-by refactors of either function"
  - "stage 3 — regression test in codeless-adapters-host or codeless-runtime: a unit test that constructs a HostFs, adds a worktree root, and asserts is_path_allowed returns true for a path under it and false for a sibling; plus an integration test (in codeless-cli or codeless-tauri-desktop, whichever already has a boot-level integration harness) that boots a runtime, submits a no-op job that creates a worktree, then calls agent_chat with cwd set to that worktree path and asserts the call does not return InvalidArgument with the fs-roots message"
  - "stage 4 — close out: flip the 'Status: open' line in BROWSER-LAUNCHER.md §'Known issues — Worktree root is not in the fs jail' to 'Status: fixed in <commit-sha>'; record under the existing 'Where it bites' bullet the line ranges actually changed in serve.rs and boot.rs; do not delete the section (it documents history for the next reader)"
