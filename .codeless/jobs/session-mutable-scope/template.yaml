name: session-mutable-scope
goal: |
  Implement the SESSION-MUTABLE-SCOPE ramp: turn SCOPE/CLAUDE.md from
  static prose that rots into a mutable rulebook the runtime amends via
  REVIEW-stage patches, with Layer-1 parse-time guards (tightening
  needs a predicate, loosening needs a positive fixture, one patch per
  REVIEW) so the rulebook compounds instead of accumulating. Ship the
  ramp's Steps 0-6; stop at Step 6 per the doc's explicit stopping
  point (no TEST-emitted patches, no auto-merge).

stages:
  - Step 0 docs-only — tighten JOB-MODEL.md handover spec with worked example + anti-example per section; add JOB-LOOP rules for ack-then-code and verify-before-handover. Resolve open questions in the scope's "Open questions" section in this stage; do not silently guess.
  - H1/H3/H7 handover correctness — per-stage handover (not per-job), keyed handover discovery (not mtime-ranked), write-time validation that done/next are non-empty. Ship in this window per the doc's dependency note.
  - Step 1 REVIEW as a real stage type — add the blocking-gate stage type in template_runner.rs with PASS/FAIL sentinel parsing only (no patch output yet); decide ReviewRequested vs ReviewGate event naming and migrate before two REVIEW concepts coexist; land the WORK-cannot-touch-rule-bearing-files Layer-1 file-set rule.
  - Step 2 diff-verify pre-check — runtime walks every path in handover.done and confirms it appears in git diff before the REVIEW prompt runs; miss is auto-FAIL with no model invoked.
  - Step 3 predicate runner — stand up the xtask-shaped crate that runs checked-in predicates on every stage diff; seed with 3-5 hand-written probes including 'no tokio::process outside codeless-adapters-host'; crate must be unreachable from the mobile build per R1.
  - REVIEW before patch-shape enforcement — confirm Steps 0-3 are integrated, kill-criterion telemetry is wired (shadow-mode patch volume + noise rate measurable), and the mutable-set / wire-format-set lists are correct before parse-time guards land that will reject malformed patches in production.
  - Step 4 SCOPE patch output in shadow mode — REVIEW stages emit structured ScopePatch proposals (new wire type in codeless-types, mobile-safe) to DOCS/SCOPE-PROPOSED.md; nothing merges automatically; instrument the four-week kill-criterion metric (proposal noise rate).
  - Step 5 patch-shape rules at parse — tightening requires predicate; loosening requires positive fixture + cited evidence stage; one patch per REVIEW; mutable-set membership; evidence_stage_id required and verified against the cited stage's diff.
  - Step 6 patch approval UX — CLI command (and/or UI affordance) to walk DOCS/SCOPE-PROPOSED.md, approve/reject/edit; approved patches land as human-authored commits with evidence stage cited in the body; predicate files land in the same commit.
  - REVIEW final — confirm ramp lands at Step 6 stopping point, no TEST-emitted patches, no auto-merge; verify R1 (crate direction), R5 (single-tenant trust boundary) unchanged; verify wire formats (JOB-MODEL.md, JOB-LOOP.md, handover.rs) untouched by REVIEW patches.
