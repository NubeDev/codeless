name: telegram-integration
goal: |
  Build a Telegram integration that lets the operator drive Codeless
  jobs from a phone, mirroring the Slack integration. Surface 1:
  /status, /start, /stop, /resume (with bypass and comment args),
  plus outbound failure notifications. The bot is a Telegram
  transport backend inside a shared codeless-bot crate (host-only),
  behind --enable-telegram-bot on the serve CLI. Shares the RPC and
  event-bus scaffolding with the slack-integration job; this job
  must not duplicate or fight with that scaffolding.

stages:
  - "Confirm slack-integration stage 1 (ResumeJobArgs.bypass + next_stage_comment, JobResumed.actor + comment) has landed on main; if not, halt and wait — do not duplicate the RPC scaffolding"
  - "Decide adapter shape: extract codeless-slack's parser + event subscriber + rate-limiter into a shared codeless-bot-core crate that both transports depend on, OR create a fresh codeless-bot crate with transport/slack.rs and transport/telegram.rs modules; pick whichever causes less churn given the state of slack-integration"
  - REVIEW before adding the Telegram transport — confirm the shared-code layout with the operator
  - "Scaffold Telegram transport (teloxide); bot token + chat_id + allowed_user_ids from secrets store; CLI --enable-telegram-bot flag plumbing; long-polling event loop"
  - "Implement Telegram command parser for Surface 1 grammar: /status, /start, /stop, /resume with bypass/comment; reply_to_message_id job-ID resolution mirroring Slack's thread_ts logic"
  - "Wire parsed commands through the shared BotTransport trait to RpcClient calls; format and post synchronous command replies"
  - REVIEW after command surface is working end-to-end from a real Telegram client
  - "Subscribe to event bus; post outbound failure notifications on JobFailed and JobStopped via Telegram with structured format; per-job 5-minute debounce; respect Telegram's 30 msg/sec/chat outbound rate limit"
  - "Surface 2: enrich failure notifications with REVIEW gate context (ReviewPreCheck / ReviewVerdict event data) when available; render structured block as Markdown V2 preformatted text"
  - REVIEW before shipping — verify keep-it-running loop is end-to-end from phone via Telegram
