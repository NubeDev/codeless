name: todos-smoketest
goal: |
  Two-stage smoke test exercising the todo-event pipeline shipped by
  todos-recorder-and-gate. Each stage's trio (checks / docs / git) is
  runtime-injected and should surface as three todo rows nested under
  the stage's task in the Stages overview tab. Each stage carries an
  explicit `verify_cmd` so the checks trio resolves; without one,
  `verify_runner` never fires and the trio gate stays open forever
  (real bug observed on the first attempt).

stages:
  - title: say hello in a fresh file under /tmp and confirm it
    verify_cmd: 'true'
  - title: count to three out loud and confirm
    verify_cmd: 'true'
