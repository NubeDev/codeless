# Plugin #0 (`notes`) — the substrate's own smoke test.
#
# See DOCS/PLUGIN-SUBSTRATE.md "Plugin #0: notes". The persona grants
# the `notes.*` namespace plus scoped `attachments.read`; raw `fs.read`
# stays off the example deliberately (substrate-doc item 6: prefer
# attachment-scoped access over host-FS access).

[plugin]
id        = "notes"
version   = "0.1.0"
crate     = "codeless-plugin-notes"

[[personas]]
id                          = "notes"
name                        = "Notes"
description                 = "Capture and append free-form markdown notes; the substrate's plugin-#0 testbed."
icon                        = "spark"
prompt_file                 = "prompts/system.md"
allowed_tools               = ["notes.*", "attachments.read"]
default_model_family        = "fast"
default_attachments_policy  = "inline-thread-scoped"

[migrations]
dir = "migrations"

[data]
dir = "domains"

# Substrate-runtimes stage 6 (PLUGIN-WASM.md § Manifest extension):
# notes ships both flavours. Codeless config (`plugins.notes.runtime
# = "wasm"`) picks the active one at server start; default is
# `builtin` if available, else `wasm`. The capability set is empty
# because the tool body returns the documented "wire-up pending"
# error today; PS-ACCEPT lands the attachments/notes-table writer.
# An empty capability set means the per-plugin linker (default-deny)
# does not link `codeless:attachments/store` or `codeless:fs/probe`,
# so the wasm build of this plugin can only export `tool` and reach
# nothing else from the host.
[[runtimes]]
kind  = "builtin"
crate = "codeless-plugin-notes"

[[runtimes]]
kind     = "wasm"
artefact = "wasm/notes.wasm"

[runtimes.capabilities]
attachments = []
fs          = []
http        = []
wall_clock  = false
