# Codeless workspace — see DOCS/SCOPE.md (in the parent
# codeless-workspace repo) for the crate table that defines the role
# of every member crate, plus the iOS-safe / Android-safe matrix that
# enforces which crates may be compiled for which targets.

[workspace]
resolver = "2"
members = [
    "crates/codeless-types",
    "crates/codeless-rpc",
    "crates/codeless-runtime",
    "crates/codeless-adapters-host",
    "crates/codeless-server",
    "crates/codeless-client",
    "crates/codeless-cli",
    "crates/codeless-tauri-desktop",
    "crates/codeless-tools",
    "crates/codeless-mcp",
    "crates/codeless-predicates",
    "crates/codeless-bot-core",
    "crates/codeless-slack",
    "crates/codeless-telegram",
    # ai-ui ↔ codeless adapter. Host-only; implements
    # `ai_ui_core::Provider` against `ai-runner`. See
    # crates/codeless-ai-ui/src/lib.rs for the design note. The
    # `ai-ui` repo is a sibling of codeless-workspace/, path-dep'd
    # at ../../../../ai-ui from inside the crate.
    "crates/codeless-ai-ui",
    # Plugin #0 — the substrate's own smoke test. Lives in-tree per
    # DOCS/PLUGIN-SUBSTRATE.md "Plugin #0: notes" so substrate
    # breakage fails CI here before it reaches a real workflow plugin.
    "crates/codeless-plugin-notes",
    # Plugin authoring SDK + its proc-macros. Mobile-safe; host
    # bridges (codeless-tools shim for builtin, codeless-plugin-host-
    # wasm for wasm) live in separate host-only crates so this pair
    # stays clean of host deps. See DOCS/plugins/PLUGIN-SUBSTRATE.md
    # "Reuse from rubix" and DOCS/plugins/PLUGIN-WASM.md "The
    # authoring SDK".
    "crates/codeless-plugin-sdk",
    "crates/codeless-plugin-sdk-macros",
    # WIT contract + committed wit-bindgen guest output. Mobile-safe.
    # See crates/codeless-tool-wit/src/lib.rs for the regeneration
    # protocol and OQ-WASM-2 in DOCS/plugins/PLUGIN-WASM.md for why
    # the bindings live in-tree rather than under build.rs.
    "crates/codeless-tool-wit",
    # Vendored from rubix-agent. Path is `../ai-runner` because the
    # crate lives one level up in `codeless-workspace/` alongside
    # this inner repo. Treated as read-only here — updates flow from
    # upstream rather than from edits made inside this workspace.
    "../ai-runner",
]
exclude = ["demos/openui-poc"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NubeDev/codeless"
# `ai-runner` references `publish.workspace`; the codeless crates are
# all internal too, so a workspace-level `publish = false` matches the
# intent on both sides.
publish = false

# Only the deps `ai-runner` opts into via `.workspace = true` are
# pinned here. The other codeless crates still pin their own
# versions explicitly — moving them is deliberately out of scope for
# this stage to keep the diff focused on the vendoring.
[workspace.dependencies]
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tracing = "0.1"
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Per CLAUDE.md / SCOPE.md, we want clippy strict from day one so
# Phase 1 doesn't accumulate quiet debt.
all = { level = "warn", priority = -1 }
