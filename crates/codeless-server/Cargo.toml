[package]
name = "codeless-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: hosted HTTP binary. axum SSE + REST surface for the browser/mobile clients."

[[bin]]
name = "codeless-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codeless-types = { path = "../codeless-types" }
codeless-rpc = { path = "../codeless-rpc" }
codeless-runtime = { path = "../codeless-runtime" }
codeless-adapters-host = { path = "../codeless-adapters-host" }
axum = "0.7"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "signal"] }
tokio-stream = "0.1"
thiserror = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
tower = { version = "0.4", features = ["util"] }
