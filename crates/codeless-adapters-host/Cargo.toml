[package]
name = "codeless-adapters-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: worktree manager, shell, PTY, CLI/REST runners, local FS, secrets-file backend. Host-only; never compiled for mobile."

[lints]
workspace = true

[dependencies]
ai-runner = { path = "../../../ai-runner" }
codeless-rpc = { path = "../codeless-rpc" }
codeless-types = { path = "../codeless-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "process", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

[features]
default = []
# Enable the OS-keychain `SecretBackend` (Secret Service on Linux,
# Keychain on macOS, Credential Manager on Windows). Off by default;
# the TOML backend stays the canonical path for CI / headless installs.
keyring = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
