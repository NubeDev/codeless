[package]
name = "codeless-adapters-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: worktree manager, shell, PTY, CLI/REST runners, local FS, secrets-file backend. Host-only; never compiled for mobile."

[lints]
workspace = true

[dependencies]
ai-runner = { path = "../../../ai-runner" }
codeless-types = { path = "../codeless-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
