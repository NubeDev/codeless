[package]
name = "codeless-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: LLM-callable tool surface (filesystem, shell, HTTP, headless browser). Host-only; never compiled for mobile. Tools reach runners through codeless-mcp."

[lints]
workspace = true

[dependencies]
codeless-types = { path = "../codeless-types" }
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "process", "io-util", "time", "rt"] }
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
