[package]
name = "codeless-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: LLM-callable tool surface (filesystem, shell, HTTP, headless browser). Host-only; never compiled for mobile. Tools reach runners through codeless-mcp."

[lints]
workspace = true

[dependencies]
codeless-types = { path = "../codeless-types" }
async-trait = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ego-tree = "0.10"
flate2 = "1"
futures-util = { workspace = true }
hex = "0.4"
octocrab = { version = "0.43", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream"] }
scraper = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = { workspace = true }
toml = "0.8"
tokio = { workspace = true, features = ["sync", "macros", "process", "io-util", "time", "rt", "fs"] }
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
