[package]
name = "codeless-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: state machine, scheduler, queue, event bus, sqlx. Host-only — never compiled for mobile."

[lints]
workspace = true

[dependencies]
codeless-types = { path = "../codeless-types" }
codeless-rpc = { path = "../codeless-rpc" }
codeless-adapters-host = { path = "../codeless-adapters-host" }
codeless-predicates = { path = "../codeless-predicates" }
codeless-tools = { path = "../codeless-tools" }
ai-runner = { path = "../../../ai-runner" }
async-trait = "0.1"
base64 = "0.22"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "1"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
wiremock = "0.6"
# Plugin-substrate PS-ACCEPT (DOCS/PLUGIN-SUBSTRATE.md Acceptance §3):
# the runtime's `plugin_substrate_e2e.rs` test loads the on-disk
# `plugins/notes/` directory through `PluginRegistry` and needs the
# crate's `register` entry point. Dev-only so the substrate's tree
# direction (`codeless-runtime` does not depend on plugins at the
# library layer) is preserved.
codeless-plugin-notes = { path = "../codeless-plugin-notes" }
