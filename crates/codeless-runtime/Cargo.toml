[package]
name = "codeless-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: state machine, scheduler, queue, event bus, sqlx. Host-only — never compiled for mobile."

[lints]
workspace = true

[dependencies]
codeless-types = { path = "../codeless-types" }
codeless-rpc = { path = "../codeless-rpc" }
async-trait = "0.1"
futures-core = "0.3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
futures-util = "0.3"
