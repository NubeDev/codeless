[package]
name = "codeless-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: CLI binary. Calls `codeless-runtime` in-process for local mode, or `codeless-client` against a hosted core."

[[bin]]
name = "codeless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codeless-adapters-host = { path = "../codeless-adapters-host" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
