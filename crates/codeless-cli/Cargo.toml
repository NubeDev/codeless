[package]
name = "codeless-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: CLI binary. Calls `codeless-runtime` in-process for local mode, or `codeless-client` against a hosted core."

[[bin]]
name = "codeless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codeless-adapters-host = { path = "../codeless-adapters-host" }
codeless-client = { path = "../codeless-client" }
codeless-rpc = { path = "../codeless-rpc" }
codeless-runtime = { path = "../codeless-runtime" }
codeless-server = { path = "../codeless-server" }
codeless-types = { path = "../codeless-types" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
