[package]
name = "codeless-ai-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless adapter: implements ai-ui's Provider trait against codeless's ai-runner. Host-only."

[lints]
workspace = true

[dependencies]
# ai-ui — path-dep to the sibling repo. default-features intentionally
# empty so we satisfy ai-ui R2 (no reqwest/claude-wrapper from ai-ui;
# codeless brings its own runner via ai-runner).
ai-ui-core = { path = "../../../../ai-ui/crates/ai-ui-core", default-features = false }
ai-ui-types = { path = "../../../../ai-ui/crates/ai-ui-types" }

# codeless's own runner stack.
ai-runner = { path = "../../../ai-runner" }

async-trait.workspace = true
bytes = "1"
futures = "0.3"
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
