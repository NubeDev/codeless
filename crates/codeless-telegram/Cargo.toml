[package]
name = "codeless-telegram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: Telegram control-plane adapter. Host-only. Mirrors the codeless-slack surface (Surfaces 1+2 from DOCS/SCOPE-TELEGRAM-INTEGRATION.md) on top of the Bot API: long-poll inbound, sendMessage outbound, MarkdownV2 renderers. Parser, BotTransport trait, ThreadMap, and ReviewCache come from codeless-bot-core."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
codeless-adapters-host = { path = "../codeless-adapters-host" }
codeless-bot-core = { path = "../codeless-bot-core" }
codeless-rpc = { path = "../codeless-rpc" }
codeless-types = { path = "../codeless-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
