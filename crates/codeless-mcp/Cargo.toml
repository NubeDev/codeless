[package]
name = "codeless-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Codeless: MCP server (stdio) exposing codeless-tools to runner subprocesses. Host-only; never compiled for mobile."

[lints]
workspace = true

[[bin]]
name = "codeless-mcp"
path = "src/main.rs"

[dependencies]
codeless-tools = { path = "../codeless-tools" }
codeless-types = { path = "../codeless-types" }
codeless-runtime = { path = "../codeless-runtime" }
async-trait = { workspace = true }
rmcp = { version = "1.6", default-features = false, features = ["server", "transport-io"] }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "1.6", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process"] }
